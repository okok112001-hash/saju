<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="만세력">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>우리끼리 만세력</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* Layout: 먹색 바탕의 한 손 모바일 앱. 금박 실선이 원국과 풀이를 책장처럼 나누고, 네 기둥은 時日月年 순으로 세운다. 단일 어두운 테마. */
:root{
  color-scheme:dark;
  --bg:#12110d; --surface:#1a1813; --surface2:#211e17; --ink:#ece4d0; --ink2:#d8cfb8; --muted:#9a907a; --line:#352f22;
  --gold:#c9a75e; --gold-dim:#6b5a33; --gold-soft:rgba(201,167,94,.33); --on-gold:#1a150a; --danger:#d9786a;
  --e0:#1f4d3e; --e1:#6e2a20; --e2:#5c4520; --e3:#d9d4c7; --e4:#1d2a45;
  --on0:#e6f0e9; --on1:#f7e4dc; --on2:#f4e8cc; --on3:#2a2720; --on4:#e4ebf7;
  --bar0:#2f7a60; --bar1:#a5402f; --bar2:#a07a33; --bar3:#d9d4c7; --bar4:#3b5a96;
  --f-display:"Gowun Batang","Noto Serif KR",serif; --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-hanja:"Noto Serif KR","Apple SD Gothic Neo",serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
header.top>:first-child{justify-self:start}
header.top>:last-child{justify-self:end}
header.top h1{grid-column:2;font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:.08em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;text-align:center}
.brand{font-family:var(--f-hanja);font-weight:600;font-size:13px;letter-spacing:.35em;color:var(--muted)}
.iconbtn{border:1px solid var(--gold-dim);background:none;color:var(--gold);border-radius:999px;padding:4px 12px;font-size:12.5px}
.back{border:0;background:none;padding:4px 2px;font-size:14px;color:var(--muted)}
main{display:flex;flex-direction:column;gap:20px;padding-top:18px}
h2{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:12px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.12em}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--gold-dim);background:none;color:var(--ink);border-radius:6px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.danger{color:var(--danger);border-color:rgba(217,120,106,.5)}
.btn.block{width:100%}
.banner{border:1px dashed var(--danger);color:var(--danger);border-radius:6px;padding:10px 12px;font-size:13px}

/* 제목줄 + 안내 */
.headrow{display:flex;align-items:center;gap:10px}
.headrow h2{flex:1;display:flex;align-items:center;gap:8px}
.info-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--gold-dim);background:none;color:var(--gold);font-family:var(--f-display);font-size:12px;font-weight:700;line-height:1;display:inline-grid;place-items:center;padding:0}
.info-btn[aria-expanded="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.info{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:13.5px;color:var(--ink2);line-height:1.7}
.info p{margin:0}.info p+p{margin-top:6px}

/* 사람 목록 */
.plist{display:flex;flex-direction:column;border-top:1px solid var(--gold-soft)}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.pitem .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.pitem .nm{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center}
.pitem .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-family:var(--f-body);font-size:11px;border:1px solid var(--gold-dim);border-radius:999px;padding:0 7px;color:var(--gold);font-weight:500}
.mini{display:flex;gap:3px}
.chev{color:var(--gold-dim);font-size:18px}

/* 글자 칩 */
.ch{display:grid;place-items:center;border-radius:4px;font-family:var(--f-hanja);font-weight:900;line-height:1}
.ch.s{width:30px;height:30px;font-size:16px;border-radius:3px}
.e0{background:var(--e0);color:var(--on0)}.e1{background:var(--e1);color:var(--on1)}.e2{background:var(--e2);color:var(--on2)}.e3{background:var(--e3);color:var(--on3)}.e4{background:var(--e4);color:var(--on4)}
.ch.unk{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--f-body);font-weight:400}

/* 인물 머리 */
.idcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.idcard .nm{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:.04em}
.idcard .meta{font-size:12.5px;color:var(--muted)}
.dm-line{font-size:14px;color:var(--ink2);margin-top:4px}
.dm-line b{font-family:var(--f-hanja);color:var(--gold);font-weight:900}

/* 원국 */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center;border-top:1px solid var(--gold-soft);border-bottom:1px solid var(--gold-soft);padding:14px 2px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pcol .lab{font-family:var(--f-hanja);font-size:13px;color:var(--muted);letter-spacing:.1em;display:flex;flex-direction:column;line-height:1.2}
.pcol .lab small{font-family:var(--f-body);font-size:10.5px;letter-spacing:0}
.pcol.day .lab{color:var(--gold)}
.pcol .tg{font-size:12px;color:var(--gold);min-height:18px}

.pcol .ch{width:100%;max-width:76px;aspect-ratio:1;font-size:32px;flex-direction:column;gap:3px;display:flex;justify-content:center;align-items:center}
.pcol .ch small{font-family:var(--f-body);font-size:11px;font-weight:400;opacity:.8}
.pcol.day .ch:not(.unk){box-shadow:inset 0 0 0 1.5px var(--gold)}
.pcol .hid{font-family:var(--f-hanja);font-size:12.5px;color:var(--muted);letter-spacing:.12em}
.pcol .stg{font-size:12px;color:var(--ink2)}
.legend-note{font-size:12.5px;color:var(--muted);margin:0;text-align:center}

/* 오행 */
.elbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--line)}
.elbar span{display:block;height:100%}
.ellegend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ellegend b{color:var(--ink);font-weight:500;margin-left:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* 대운 · 세운 */
.sechead{display:flex;align-items:center;gap:10px}
.sechead h3{white-space:nowrap}
.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.cell{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-variant-numeric:tabular-nums;color:var(--ink)}
.cell .a{font-size:12px;color:var(--muted)}
.cell .t{font-size:11px;color:var(--gold)}
.cell.now{border-color:var(--gold);background:var(--surface2)}
.cell.now .a{color:var(--gold);font-weight:600}
button.cell{font:inherit}

/* 연도별 운세 */
.yearbox{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--gold-soft);padding-top:22px}
.yearbox .rsec,.yearbox>h2{margin-bottom:12px}
.yearbox>h2{font-size:18px;color:var(--gold);display:flex;align-items:center;gap:12px;text-align:center;font-family:var(--f-display);margin:0 0 12px}
.yearbox>h2::before,.yearbox>h2::after{content:"";flex:1;height:1px;background:var(--line)}
.yearbox>h2 .t{display:flex;flex-direction:column;align-items:center}
.yearbox>h2 .sub{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.seun{padding-bottom:0}
.seun .cell{position:relative;margin-bottom:10px}
.seun .cell.now::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--gold)}
.yearpanel{background:var(--surface);border:1px solid var(--gold-dim);border-radius:6px;padding:16px}
.yeartitle{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.yeartitle .y{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.yeartitle .k{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--gold)}
.yearpanel p{font-family:var(--f-display);font-size:15px;line-height:1.85;color:var(--ink2);margin:0 0 10px}
.yearpanel p:last-child{margin-bottom:0}
/* 오늘 카테고리 */
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:7px 14px;font-size:14px}
.cats button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.catpanel{min-height:180px}
.catpanel>h2{font-size:18px;color:var(--gold);display:flex;align-items:center;gap:12px;margin:0 0 12px;text-align:center;font-family:var(--f-display)}
.catpanel>h2::before,.catpanel>h2::after{content:"";flex:1;height:1px;background:var(--line)}
.catpanel>h2 .t{display:flex;flex-direction:column;align-items:center}
.catpanel>h2 .sub{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.catpanel p{font-family:var(--f-display);font-size:15px;line-height:1.85;color:var(--ink2);margin:0 0 10px}
/* 소제목 · 월별 */
.subh{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--gold);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.subh::before{content:"";width:4px;height:4px;background:var(--gold);transform:rotate(45deg);flex:none}
.rsec>h2+.subh,.catpanel>h2+.subh,.ypbody>.subh:first-child{margin-top:4px}
.natbox>h2,.yearbox>h2{margin-bottom:0}
.natbox>h2{font-size:18px;color:var(--gold);display:flex;align-items:center;gap:12px;text-align:center;font-family:var(--f-display)}
.natbox>h2::before,.natbox>h2::after{content:"";flex:1;height:1px;background:var(--line)}
.natbox>h2 .t{display:flex;flex-direction:column;align-items:center}
.natbox>h2 .sub{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.yearpanel .cats{margin-bottom:14px}
.ypbody p{font-family:var(--f-display);font-size:15px;line-height:1.85;color:var(--ink2);margin:0 0 10px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mlist li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.mlist .mm{font-family:var(--f-display);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2em}
.mlist .mg{font-size:12.5px;color:var(--muted)}
.mlist .mk{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.mlist .mk.good{border-color:var(--gold);color:var(--gold)}
.mlist .mk.warn{border-color:rgba(217,120,106,.6);color:var(--danger)}
.mlist .mt{grid-column:1/-1;font-family:var(--f-display);font-size:14.5px;line-height:1.75;color:var(--ink2)}
.catpanel .rsec>h2{margin-bottom:8px}
/* 풀이 */
.reading{display:flex;flex-direction:column;gap:26px;padding-top:4px}
.rsec h2{font-size:18px;color:var(--gold);display:flex;align-items:center;gap:12px;margin-bottom:12px;text-align:center}
.rsec h2::before,.rsec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.rsec h2 .sub{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;display:block;margin-top:2px;letter-spacing:.02em}
.rsec h2 .t{display:flex;flex-direction:column;align-items:center}
.rsec p{font-family:var(--f-display);font-size:15px;line-height:1.85;color:var(--ink2);margin:0 0 10px}
.rsec p:last-child{margin-bottom:0}
details.calc summary{cursor:pointer;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink2)}
.note{font-size:13px;color:var(--danger);margin:0}

/* 폼 */
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lbl{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.06em}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 12px;min-width:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--gold-dim);outline:none}
input::placeholder{color:#6d6553}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 6px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.err{color:var(--danger);font-size:13px;min-height:1em}

/* 토글 */
.toggle{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.toggle .d{grid-column:1/-1;font-size:13px;color:var(--muted)}
.sw{position:relative;width:46px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
.sw[aria-checked="true"]::after{left:21px;background:var(--on-gold)}

/* 궁합 · 오늘 */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:8px 16px;border-bottom:1px solid var(--gold-soft)}
.pairline{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:100%}
.pairline .who{display:flex;flex-direction:column;gap:6px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;min-width:0}
.pairline .x{font-family:var(--f-hanja);color:var(--gold);font-weight:900;font-size:22px}
.score{display:flex;flex-direction:column;align-items:center;gap:4px}
.score .n{font-family:var(--f-display);font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.score .n small{font-size:18px;margin-left:2px}
.score .l{font-size:14px;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2)}
.chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);font-weight:600}
.dateline{font-family:var(--f-display);font-size:22px;font-weight:700}
.stars{font-size:22px;letter-spacing:4px;color:var(--gold)}
.stars .off{color:var(--line)}
.luck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;text-align:center}
.luck div{padding:12px 4px}
.luck div+div{border-left:1px solid var(--line)}
.luck b{display:block;font-family:var(--f-display);font-size:16px;color:var(--gold)}
.luck span{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:36px 8px;color:var(--muted);font-family:var(--f-display)}

/* 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--gold-soft);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
nav.tabs button .g{font-family:var(--f-hanja);font-size:20px;font-weight:900;line-height:1.1}
nav.tabs button[aria-current="page"]{color:var(--gold)}

/* 이미지 미리보기 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay img{max-height:72vh;max-width:100%;border-radius:6px;border:1px solid var(--gold-dim)}
.overlay p{color:var(--ink);margin:0;font-size:14px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--on-gold);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30}
.capfoot{display:none;font-family:var(--f-display);font-size:12px;color:var(--gold-dim);text-align:center;letter-spacing:.1em;padding-top:8px}
.capturing .capfoot{display:block}
.capturing .nocap{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head><body>


<div class="wrap">
  <header class="top" id="topbar"></header>

  const BR_HAP = [[0, 1], [2, 11], [3, 10], [4, 9], [5, 8], [6, 7]];
  const SAMHAP = [[8, 0, 4], [11, 3, 7], [2, 6, 10], [5, 9, 1]];
  const WONJIN = [[0, 7], [1, 6], [2, 9], [3, 8], [4, 11], [5, 10]];
  const pairIn = (L, a, b) => L.some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));
  function brRel(a, b) {
    const r = [];
    if (a === b) r.push('같음');
    if (pairIn(BR_HAP, a, b)) r.push('육합');
    if (a !== b && SAMHAP.some(t => t.includes(a) && t.includes(b))) r.push('삼합');
    if (mod(a - b, 12) === 6) r.push('충');
    if (pairIn(WONJIN, a, b)) r.push('원진');
    return r;
  }
  function stemRel(a, b) {
    if (pairIn(STEM_HAP, a, b)) return '합';
    if (pairIn(STEM_CHUNG, a, b)) return '충';
    const ea = stemEl(a), eb = stemEl(b);
    if (ea === eb) return '비화';
    if (mod(ea + 1, 5) === eb || mod(eb + 1, 5) === ea) return '상생';
    return '상극';
  }

  /**
   * input: {cal:'solar'|'lunar', leap, y,m,d, timeKnown, hh, mm, gender:'M'|'F', lon}
   * opts: {solarTime:bool, yajasi:bool}
   */
  function compute(input, opts) {
    opts = opts || {};
    const notes = [];
    let sy = input.y, sm = input.m, sd = input.d;
    if (input.cal === 'lunar') {
      const s = lunarToSolar(input.y, input.m, input.d, input.leap);
      if (!s) throw new Error('존재하지 않는 음력 날짜입니다.');
      sy = s.y; sm = s.m; sd = s.d;
    }
    if (sy < 1900 || sy > 2100) throw new Error('1900~2100년 사이만 계산할 수 있어요.');
    const timeKnown = !!input.timeKnown;
    const hh = timeKnown ? input.hh : 12, mi = timeKnown ? input.mm : 0;
    const wall = Date.UTC(sy, sm - 1, sd, hh, mi);
    const lt = localToUtc(wall);
    const utc = lt.utc;
    if (timeKnown && lt.note === 'gap') notes.push('서머타임이 시작되며 건너뛴 시각이라 표준시로 해석했어요.');
    if (timeKnown && lt.note === 'ambiguous') notes.push('서머타임이 끝나며 두 번 있었던 시각이라 서머타임 기준으로 해석했어요.');
    const oz = offsetAtUtc(utc);
    const stdOff = oz.off - (oz.dst ? 3600000 : 0);
    const lon = input.lon || 126.98;
    let basis, basisLabel, corrMin;
    if (opts.solarTime) {
      basis = utc + lon * 240000; corrMin = Math.round((basis - wall) / MIN);
      basisLabel = '경도 보정';
    } else {
      basis = utc + stdOff; corrMin = Math.round((basis - wall) / MIN);
      basisLabel = '표준시';
    }
    const bd = new Date(basis);
    let by = bd.getUTCFullYear(), bm = bd.getUTCMonth() + 1, bdd = bd.getUTCDate();
    const bh = bd.getUTCHours(), bmin = bd.getUTCMinutes();

    // 년·월주 (절입 시각과 출생 순간 비교)
    const ji = jieIndexAt(utc);
    const ti = termInfo(ji);
    const sajuYear = (ti.j === 0) ? ti.year - 1 : ti.year; // 소한~입춘 전은 전년
    const yearP = yearGzOf(sajuYear);
    const monthBr = (ti.j + 1) % 12;
    const firstStem = mod((yearP.s % 5) * 2 + 2, 10);
    const monthP = gzFrom(mod(firstStem + mod(monthBr - 2, 12), 10), monthBr);

    // 시간 모름 + 그날 절입
    if (!timeKnown) {
      const dayStartUtc = localToUtc(Date.UTC(sy, sm - 1, sd, 0, 0)).utc;
      const dayEndUtc = dayStartUtc + DAY;
      const t2 = TERMS.findIndex(t => t >= dayStartUtc && t < dayEndUtc);
      if (t2 >= 0) notes.push(`태어난 날에 절기(${JIE_NAMES[t2 % 12]})가 바뀌어서, 시간을 모르면 월주${JIE_NAMES[t2 % 12] === '입춘' ? '·년주' : ''}가 틀릴 수 있어요. 정오 기준으로 계산했어요.`);
    }

    // 일·시주
    let dayP, hourP = null, hourBr = null;
    if (timeKnown) {
      const late = bh >= 23;
      let dY = by, dM = bm, dD = bdd;
      if (late && !opts.yajasi) { const n = new Date(Date.UTC(by, bm - 1, bdd + 1)); dY = n.getUTCFullYear(); dM = n.getUTCMonth() + 1; dD = n.getUTCDate(); }
      dayP = dayGz(dY, dM, dD);
      hourBr = Math.floor((bh * 60 + bmin + 60) / 120) % 12;
      let stemBase = dayP.s;
      if (late && opts.yajasi) stemBase = mod(dayP.s + 1, 10);
      hourP = gzFrom(mod((stemBase % 5) * 2 + hourBr, 10), hourBr);
      if (late) notes.push(opts.yajasi ? '밤 11시~자정 출생: 야자시를 적용해 일주는 당일, 시주는 다음 날 기준으로 잡았어요.' : '밤 11시~자정 출생: 다음 날 자시로 보아 일주를 다음 날로 잡았어요.');
    } else {
      dayP = dayGz(sy, sm, sd);
    }
    const dm = dayP.s;

    const pillars = [
      hourP ? { key: 'hour', label: '시주', ...hourP } : null,
      { key: 'day', label: '일주', ...dayP },
      { key: 'month', label: '월주', ...monthP },
      { key: 'year', label: '년주', ...yearP },
    ].map(p => p && ({
      ...p,
      stemTG: p.key === 'day' ? '일간' : tenGod(dm, p.s),
      brTG: tenGodBr(dm, p.b),
      hidden: HIDDEN[p.b].filter(x => x !== null).map(s => ({ s, tg: tenGod(dm, s) })),
      stage: stage(dm, p.b),
    }));

    // 오행 분포 (글자 수)
    const elCount = [0, 0, 0, 0, 0];
    pillars.forEach(p => { if (p) { elCount[stemEl(p.s)]++; elCount[BR_EL[p.b]]++; } });
    // 십신 그룹 (일간 제외, 지지는 정기 기준)
    const groups = { 비겁: 0, 식상: 0, 재성: 0, 관성: 0, 인성: 0 };
    const tgCount = {}; TEN.forEach(t => tgCount[t] = 0);
    pillars.forEach(p => {
      if (!p) return;
      if (p.key !== 'day') { groups[TG_GROUP[p.stemTG]]++; tgCount[p.stemTG]++; }
      groups[TG_GROUP[p.brTG]]++; tgCount[p.brTG]++;
    });
    // 간이 신강/신약: 득령(월지) 2, 그 외 일간을 돕는 글자 1
    const helps = s => { const e = stemEl(dm); return s === e || mod(s + 1, 5) === e; };
    let support = 0, total = 0;
    pillars.forEach(p => {
      if (!p) return;
      if (p.key !== 'day') { total += 1; if (helps(stemEl(p.s))) support += 1; }
      const w = p.key === 'month' ? 2.5 : (p.key === 'day' ? 1.5 : 1);
      total += w; if (helps(BR_EL[p.b])) support += w;
    });
    const ratio = support / total;
    const strength = ratio >= 0.58 ? '신강' : ratio <= 0.42 ? '신약' : '중화';

    // 대운
    const forward = (isYang(yearP.s) && input.gender === 'M') || (!isYang(yearP.s) && input.gender === 'F');
    const nextUtc = TERMS[ji + 1], prevUtc = TERMS[ji];
    const diffDays = (forward ? nextUtc - utc : utc - prevUtc) / DAY;
    const startYearsExact = diffDays / 3;
    const daeunNum = Math.max(1, Math.round(startYearsExact));
    const daeun = [];
    for (let k = 1; k <= 10; k++) {
      const p = gz(monthP.i + (forward ? k : -k));
      const age = daeunNum + (k - 1) * 10;
      daeun.push({ ...p, age, startYear: sy + age, stemTG: tenGod(dm, p.s), brTG: tenGodBr(dm, p.b), stage: stage(dm, p.b) });
    }

    const lunar = input.cal === 'lunar' ? { y: input.y, m: input.m, d: input.d, leap: !!input.leap } : solarToLunar(sy, sm, sd);
    return {
      input, solar: { y: sy, m: sm, d: sd }, lunar, utc, timeKnown,
      wall: { hh, mm: mi }, basis: { y: by, m: bm, d: bdd, hh: bh, mm: bmin, label: basisLabel, corrMin, dst: oz.dst, stdOffMin: stdOff / MIN },
      jie: { name: ti.name, utc: ti.utc, next: termInfo(ji + 1) },
      pillars, dayMaster: dm, elCount, groups, tgCount, strength, strengthRatio: ratio,
      daeun, daeunForward: forward, daeunExact: startYearsExact, notes,
    };
  }

  function yearPillar(Y, dm) { const p = yearGzOf(Y); return { ...p, Y, stemTG: tenGod(dm, p.s), brTG: tenGodBr(dm, p.b), stage: stage(dm, p.b) }; }
  function todayPillar(y, m, d, dm) { const p = dayGz(y, m, d); return { ...p, stemTG: tenGod(dm, p.s), brTG: tenGodBr(dm, p.b), stage: stage(dm, p.b) }; }

  return {
    compute, lunarToSolar, solarToLunar, hasLeap, lunarMonthLen, yearPillar, todayPillar, dayGz, yearGzOf,
    tenGod, tenGodBr, stage, brRel, stemRel, stemEl, isYang, localToUtc, offsetAtUtc, jieList,
    STEM_H, STEM_K, BR_H, BR_K, ANIMAL, EL_K, EL_H, BR_EL, TEN, TG_GROUP, JIE_NAMES,
  };
})();
if (typeof module !== 'undefined') module.exports = SajuEngine;
</script>

    if (g.인성 >= 3 && jae <= 1) money.push('배움(인성)이 강해 자격증이나 전문 지식이 곧 재산이 되는 타입이에요.');
    const jd = r.daeun.filter(x => hasGroup(x, '재성') && x.age + 9 >= age).slice(0, 3);
    money.push(H('재물운이 강해지는 시기'));
    money.push(jd.length ? `대운으로 보면 ${jd.map(x => `${ageRange(x)}(${gzK(x)} 대운)`).join(', ')}에 재물의 기운이 들어와요. 이 시기에 수입을 늘리고 자산을 만들 기회가 커진다고 봐요.` : '앞으로의 대운에서는 재성이 직접 들어오지 않아요. 큰 한 방보다 실력과 신뢰를 쌓아 꾸준히 버는 방식이 더 맞는 흐름입니다.');
    out.push({ key: 'money', title: '재물', paras: money });

    // 직업
    const order = ['관성', '식상', '재성', '인성', '비겁'];
    const top = order.slice().sort((a, b) => g[b] - g[a])[0];
    const job = [H('타고난 직업 성향'), SOCIAL[month.brTG], `가장 두드러진 기운은 ${top}이라 ${CAREER_G[top]}에서 강점을 보이기 쉬워요. 일간의 오행(${EL[myEl]})으로 보면 ${CAREER_E[myEl]} 분야와도 인연이 있습니다.`];
    job.push(H('일하는 방식'), WORK_STYLE[r.strength]);
    if (g.관성 >= 1 && g.인성 >= 1) job.push('책임(관성)과 배움(인성)이 함께 있어(관인상생) 조직 안에서 인정받고 차근차근 올라가는 흐름이 좋아요.');
    if (g.식상 >= 2 && g.관성 >= 2) job.push('표현하려는 기운과 규칙의 기운이 모두 강해 조직 안에서 답답함을 느낄 수 있어요. 재량이 있는 역할을 고르면 좋습니다.');
    const cd = r.daeun.filter(x => (hasGroup(x, '관성') || E.TG_GROUP[x.stemTG] === '인성') && x.age + 9 >= age).slice(0, 3);
    job.push(H('일에서 도약하는 시기'), cd.length ? `${cd.map(x => `${ageRange(x)}(${gzK(x)} 대운)`).join(', ')}에 자리와 명예, 배움의 기운이 들어와요. 승진, 자격 취득, 역할 확대 같은 변화가 생기기 좋은 시기로 봐요.` : '앞으로의 대운에서는 관성·인성이 크게 들어오지 않아요. 남이 정해 준 자리보다 내 실력과 이름으로 일하는 방식이 더 잘 맞는 흐름입니다.');
    out.push({ key: 'career', title: '직업', paras: job });

    // 연애
    const star = starGroup(r), starN = g[star];
    const love = [H('연애 스타일'), DM_LOVE[dm], H('인연의 별')];
    love.push(`전통 명리에서는 ${r.input.gender === 'M' ? '남성은 재성' : '여성은 관성'}을 이성 인연의 별로 봐요.`);
    if (starN === 0) love.push('원국에 인연의 별이 드러나지 않아 인연이 저절로 찾아오기보다 직접 만들어 가는 편이에요. 그 별이 들어오는 대운이나 해에 좋은 만남이 생기기 쉽습니다.');
    else if (starN <= 2) love.push('인연의 별이 적당히 있어 자연스럽게 만나고 관계를 꾸려 가는 흐름이에요.');
    else love.push('인연의 별이 많아 이성의 관심을 받기 쉬워요. 선택지가 많은 만큼 신중하게 고르는 게 중요합니다.');
    love.push(H('배우자 자리'), SPOUSE[day.brTG]);
    const brs = pillarsOf(r).map(p => p.b);
    if (brs.filter(b => [0, 3, 6, 9].includes(b)).length >= 2) love.push('지지에 자·오·묘·유가 여럿 있어 사람을 끄는 매력과 인기가 있어요.');
    if (pillarsOf(r).some(p => p.key !== 'day' && E.brRel(p.b, day.b).includes('충'))) love.push('배우자 자리(일지)를 다른 글자가 충하고 있어 관계에 변화가 생기기 쉬워요. 서로의 공간과 시간을 존중하면 안정됩니다.');
    const ly = []; for (let Y = nowY; Y < nowY + 10 && ly.length < 4; Y++) { const p = E.yearPillar(Y, dm); if (hasGroup(p, star)) ly.push(`${Y}년(${gzK(p)})`); }
    love.push(H('인연의 기운이 들어오는 해'), ly.length ? `앞으로 10년 중 ${ly.join(', ')}에 인연의 별이 들어와요. 새로운 만남이나 관계의 진전이 생기기 쉬운 해로 봐요.` : '앞으로 10년 안에는 인연의 별이 해마다 직접 들어오지는 않아요. 대신 사람을 많이 만나는 환경을 직접 만드는 것이 인연을 부르는 방법이에요.');
    out.push({ key: 'love', title: '연애', paras: love });

    // 건강
    const health = ['오행의 많고 적음으로 전통적으로 연결 짓는 부분이에요. 실제 건강은 검진과 생활 습관으로 판단하세요.', H('타고난 체질'), HEALTH_DM[myEl]];
    const over = ec.map((c, i) => c >= 3 ? i : -1).filter(i => i >= 0);
    if (over.length || lack.length) health.push(H('신경 쓸 부분'));
    over.forEach(i => health.push(`${EL[i]} 기운이 많아(${ec[i]}개) ${ORGAN[i].o} 쪽을 과하게 쓰기 쉽다고 봐요. ${j(ORGAN[i].tip, '이', '가')} 도움이 됩니다.`));
    lack.forEach(i => health.push(`${EL[i]} 기운이 없어 ${ORGAN[i].o} 쪽이 상대적으로 약할 수 있다고 봐요. ${j(ORGAN[i].tip, '을', '를')} 챙기세요.`));
    if (!over.length && !lack.length) health.push('오행이 비교적 고르게 분포되어 있어 특별히 치우친 곳은 없어요. 규칙적인 생활이 가장 좋은 관리입니다.');
    health.push(H('계절 관리'), `${SEASON_NAME[se]}에 태어난 사람이라 ${['봄철 환절기에 기운이 들뜨기 쉬우니 수면 리듬을 지키세요.', '더위에 지치기 쉬우니 여름철 수분과 휴식을 넉넉히 챙기세요.', '건조한 가을에 호흡기와 피부를 특히 챙기세요.', '추위에 약해지기 쉬우니 겨울철 보온과 순환에 신경 쓰세요.'][se]}`);
    out.push({ key: 'health', title: '건강', paras: health });

    // 신살
    const ss = sinsal(r);
    const sp = ['신살은 사주에 붙는 특별한 별이에요. 좋고 나쁨을 단정하기보다 타고난 개성으로 보는 것이 요즘의 해석이에요.'];
    if (ss.length) ss.forEach(s => sp.push(H(`${s.name} · ${s.where.join('·')}`), SINSAL[s.name]));
    else sp.push('대표적인 신살이 두드러지지 않아요. 특정한 별에 치우치지 않아 사주 전체의 균형으로 운을 읽는 타입이에요.');
    out.push({ key: 'sinsal', title: '신살', paras: sp });

    // 대운
    const du = [];
    if (curD) {
      const nx = r.daeun[r.daeun.indexOf(curD) + 1];
      du.push(H(`지금 · ${gzK(curD)} 대운 (${ageRange(curD)})`), DAEUN_TG[curD.stemTG], `지지는 ${curD.brTG}의 기운이고, 대운의 힘은 12운성으로 ${curD.stage}에 해당해요. ${YEAR_STAGE[curD.stage].replace(/ 해/g, ' 시기')}`);
      if (nx) du.push(H(`다음 · ${gzK(nx)} 대운 (${ageRange(nx)}, ${nx.startYear}년부터)`), DAEUN_TG[nx.stemTG]);
    } else du.push(H('첫 대운 전'), `첫 대운은 ${r.daeun[0].age}세에 시작돼요. 그 전까지는 타고난 원국의 기운이 그대로 드러나는 시기예요.`);
    du.push(H('인생 전체의 흐름'));

    // 개운법

    out.push({ key: 'gaeun', title: '개운법', paras: [
      `내 사주의 균형을 맞추는 데 도움이 되는 기운은 ${j(EL[he], '이에요', '예요')}. 전통적으로 이 기운과 연결된 것들을 가까이하면 운의 흐름이 부드러워진다고 봐요.`,
      H('색과 방향'), `${L.color} 계열의 옷이나 소품, ${L.dir} 방향, 숫자 ${L.num}이 잘 맞아요.`,
      H('음식'), `${j(G.food, '이', '가')} ${EL[he]} 기운과 연결돼요.`,
      H('행동과 장소'), `${j(G.act, '이', '가')} 좋아요. ${G.place}에서 시간을 보내면 마음이 편안해지기 쉬워요.`,
      H('좋은 계절'), `${G.season}에 기운이 살아나기 쉬워요. 중요한 시작을 이 계절에 맞춰 보는 것도 방법이에요.`,
      '개운법은 전통적인 상징 체계라 과학적인 효과가 있다는 뜻은 아니에요. 기분 전환과 생활 습관의 계기로 활용해 보세요.',
    ] });
    return out;
  }

  // ================= 연도별 운세 =================
  const SAMJAE_T = { 8: [2, 3, 4], 0: [2, 3, 4], 4: [2, 3, 4], 11: [5, 6, 7], 3: [5, 6, 7], 7: [5, 6, 7], 2: [8, 9, 10], 6: [8, 9, 10], 10: [8, 9, 10], 5: [11, 0, 1], 9: [11, 0, 1], 1: [11, 0, 1] };
  function yearFortune(r, Y) {
    const dm = r.dayMaster, p = E.yearPillar(Y, dm);
    const day = pk(r, 'day'), yearP = pk(r, 'year'), month = pk(r, 'month');
    const main = YEAR_TG[p.stemTG];
    const H = h => ({ h });
    const now = r.daeun.slice().reverse().find(d => Y >= d.startYear);
    // 총운
    const tot = [`${Y}년은 ${E.STEM_K[p.s]}${E.BR_K[p.b]}년(${E.ANIMAL[p.b]}의 해)이에요. 나에게는 천간이 ${p.stemTG}, 지지가 ${j(p.brTG, '이에요', '예요')}.`, main.d, YEAR_BR[E.TG_GROUP[p.brTG]]];
    const rd = E.brRel(p.b, day.b), ry = E.brRel(p.b, yearP.b), rm = E.brRel(p.b, month.b);
    const rel = [];
    if (rd.includes('충')) rel.push('올해의 지지가 배우자 자리(일지)와 충해서 이사, 이직, 관계 변화 같은 움직임이 생기기 쉬워요. 큰 결정은 충분히 따져 보세요.');
    else if (rd.includes('육합') || rd.includes('삼합')) rel.push('올해의 지지가 일지와 합을 이뤄 새로운 인연이나 협력 관계가 생기기 좋아요.');
    if (rm.includes('충')) rel.push('올해의 지지가 월지와 충해 직장이나 사회적 환경에 변화가 생기기 쉬워요.');
    if (ry.includes('같음')) rel.push(`태어난 해와 같은 ${E.ANIMAL[p.b]}띠 해예요. 전통적으로 자신을 돌아보고 새 주기를 시작하는 해로 봐요.`);
    else if (ry.includes('충')) rel.push('태어난 해의 띠와 충하는 해라 집안이나 주변 환경에 크고 작은 변화가 생길 수 있어요.');
    if (rel.length) tot.push(H('올해 부딪히고 어울리는 기운'), ...rel);
    const sj = SAMJAE_T[yearP.b];
    if (sj && sj.includes(p.b)) tot.push(`민간에서 말하는 삼재(${['들삼재', '눌삼재', '날삼재'][sj.indexOf(p.b)]})에 해당하는 해예요. 근거가 있는 이론은 아니니 무리한 일을 줄이는 정도로만 참고하세요.`);
    if (now) tot.push(H('대운과 함께 보기'), `지금은 ${gzK(now)} 대운(${now.age}세~)으로 10년의 큰 흐름은 ${DAEUN_SHORT[E.TG_GROUP[now.stemTG]]}예요. ${E.TG_GROUP[now.stemTG] === E.TG_GROUP[p.stemTG] ? '올해의 기운이 대운과 같은 방향이라 그 흐름이 한층 강하게 드러나는 해예요.' : `여기에 올해는 ${E.TG_GROUP[p.stemTG]}의 기운이 더해져, 큰 흐름 속에 '${main.t}'의 색깔이 더해지는 한 해예요.`}`);
    // 재물
    const mon = [YEAR_MONEY[p.stemTG]];
    if (E.TG_GROUP[p.brTG] === '재성' && E.TG_GROUP[p.stemTG] !== '재성') mon.push('지지에 재물의 기운이 있어 하반기로 갈수록 실속 있는 수입이 생기기 쉬워요.');
    else if (E.TG_GROUP[p.brTG] === '재성') mon.push('지지에도 재물의 기운이 있어 한 해 내내 돈의 흐름이 활발해요. 들어오는 돈과 나가는 돈을 모두 기록해 두면 실속이 남아요.');
    else if (E.TG_GROUP[p.brTG] === '비겁') mon.push('지지에 같은 기운이 있어 지출이 분산되기 쉬우니 큰돈은 목적별로 나눠 관리하세요.');
    else mon.push(`지지의 ${p.brTG} 기운까지 함께 보면, ${E.TG_GROUP[p.brTG] === '식상' ? '부지런히 움직이고 만들어 내는 만큼 돈이 따라오는 흐름이에요.' : E.TG_GROUP[p.brTG] === '관성' ? '책임이 늘어나는 만큼 고정 지출도 늘 수 있어요.' : '공부나 준비에 쓰는 돈이 나중에 돌아오는 흐름이에요.'}`);
    if (r.groups.재성 === 0 && hasGroup(p, '재성')) mon.push('원국에 없던 재물의 별이 들어오는 해라 평소보다 돈에 관한 기회와 관심이 커지는 해예요.');
    // 직업
    const work = [YEAR_WORK[p.stemTG]];
    if (hasGroup(p, '관성') && r.groups.인성 >= 1) work.push('올해 들어오는 관성이 원국의 인성과 이어져 시험, 승진, 자격 같은 공식적인 성과로 연결되기 좋아요.');
    if (hasGroup(p, '식상') && r.groups.관성 >= 2) work.push('표현의 기운이 원국의 관성과 부딪힐 수 있어 조직 안에서 의견을 낼 때는 시기와 방식을 고르세요.');
    work.push(E.stage(dm, p.b) === '건록' || E.stage(dm, p.b) === '제왕' || E.stage(dm, p.b) === '관대' ? '올해는 일간의 힘이 강해지는 자리라 주도적으로 나서도 좋은 해예요.' : E.stage(dm, p.b) === '절' || E.stage(dm, p.b) === '태' || E.stage(dm, p.b) === '양' ? '올해는 다음을 준비하는 자리라 큰 승부보다 실력을 다지는 데 쓰면 좋은 해예요.' : '올해는 무리하게 앞서기보다 흐름을 보며 차근차근 나아가는 것이 좋은 해예요.');
    // 연애
    const star = starGroup(r);
    const love = [YEAR_LOVE[p.stemTG]];
    if (hasGroup(p, star)) love.push(`올해는 인연의 별(${star})이 들어와 연애운이 특히 활발한 해로 봐요. 혼자라면 새로운 만남에, 연인이 있다면 관계의 진전에 좋은 해예요.`);
    else love.push('올해는 인연의 별이 직접 들어오지 않아, 새로운 만남보다 지금의 관계를 깊게 만드는 데 더 좋은 해예요.');
    if (rd.includes('육합')) love.push('올해의 지지가 배우자 자리와 합을 이뤄 결혼이나 동거 같은 관계의 변화가 생기기 좋은 흐름이에요.');
    else if (rd.includes('충')) love.push('배우자 자리가 충을 받아 관계에 변화가 생기기 쉬우니, 서운한 마음은 쌓아 두지 말고 그때그때 대화로 푸세요.');
    // 건강
    const st = E.stage(dm, p.b);
    const hl = [YEAR_STAGE[st]];
    const ec = r.elCount, yE = [E.stemEl(p.s), E.BR_EL[p.b]];
    const ov = [...new Set(yE)].filter(e => ec[e] >= 3);
    ov.forEach(e => hl.push(`원국에 이미 많은 ${EL[e]} 기운이 올해 더해져 ${ORGAN[e].o} 쪽에 무리가 가기 쉽다고 봐요. ${j(ORGAN[e].tip, '을', '를')} 신경 쓰세요.`));

    const nowY = new Date().getFullYear(), yp = E.yearGzOf(nowY);
    const ra = E.brRel(yp.b, da.b), rb = E.brRel(yp.b, db.b);
    const tya = E.tenGod(da.s, yp.s), tyb = E.tenGod(db.s, yp.s);
    const yearT = [`${nowY}년 ${E.STEM_K[yp.s]}${E.BR_K[yp.b]}년은 ${na} 님에게 ${YEAR_TG[tya].t}, ${nb} 님에게 ${YEAR_TG[tyb].t}예요.`];
    if (ra.includes('충') || rb.includes('충')) yearT.push(`올해는 ${ra.includes('충') && rb.includes('충') ? '두 사람 모두' : ra.includes('충') ? na + ' 님' : nb + ' 님'}의 배우자 자리가 충을 받아 생활에 변화가 생기기 쉬워요. 이사나 이직 같은 큰 결정은 함께 충분히 이야기하세요.`);
    else if (ra.includes('육합') || rb.includes('육합')) yearT.push('올해의 기운이 배우자 자리와 합을 이뤄 관계가 한 걸음 가까워지기 좋은 해예요.');
    else yearT.push('올해는 관계를 크게 흔드는 기운이 없어 함께 계획을 세우고 실천하기 좋은 해예요.');
    sec.push({ title: '올해의 두 사람', paras: yearT });
    // 10. 조언
    const p8 = [];
    const sA = a.strength, sB = b.strength;
    if (sA === '신강' && sB === '신강') p8.push('두 사람 모두 기운이 강한 편이라 주도권을 두고 부딪히기 쉬워요. 영역을 나눠 각자 결정하는 분야를 정해 두면 편해집니다.');
    else if (sA === '신약' && sB === '신약') p8.push('두 사람 모두 기운이 섬세한 편이라 서로 기대려다 결정이 늦어질 수 있어요. 중요한 일은 기한을 정해 두고 함께 결정하세요.');
    else if (sA !== sB) p8.push('한 사람이 이끌고 다른 사람이 받쳐 주는 균형이 생기기 쉬운 조합이에요. 이끄는 쪽은 상대의 속도를 존중하고, 받쳐 주는 쪽은 원하는 걸 분명히 말하는 게 좋아요.');
    if (rd.includes('충') || rd.includes('원진') || sr === '충') p8.push('부딪히는 기운이 있는 관계라 다툼 자체보다 다툰 뒤 푸는 방식이 더 중요해요. 화가 난 상태에서는 결론을 내지 않는다는 규칙을 함께 정해 두세요.');
    else p8.push('큰 충돌 요소가 적은 관계예요. 편안함이 무관심으로 바뀌지 않도록 가끔은 새로운 경험을 함께 만들어 보세요.');
    sec.push({ title: '관계를 위한 조언', paras: p8 });
    score = Math.max(30, Math.min(98, Math.round(score)));
    const label = score >= 85 ? '아주 잘 맞아요' : score >= 72 ? '잘 맞는 편이에요' : score >= 58 ? '노력하면 좋아요' : '서로 이해가 필요해요';
    return { score, label, sections: sec };
  }

  return { natal, yearFortune, today, gunghap, helpEl, DM, LUCK };
})();
if (typeof module !== 'undefined') module.exports = SajuInterp;

const SAMPLE={id:'sample',sample:true,name:'예시 홍길동',gender:'M',cal:'solar',leap:false,y:1990,m:5,d:17,timeKnown:true,hh:7,mm:40,city:'서울',lon:126.98};

function submitForm(){

// ---------- 이미지 저장 ----------
async function saveImg(id){
  const el=document.getElementById(id);if(!el)return;
  if(typeof html2canvas==='undefined'){toast('이미지 도구를 불러오지 못했어요. 잠시 후 다시 해 주세요.');return}
  document.body.classList.add('capturing');
  let canvas;
  try{canvas=await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true,logging:false})}
  catch(e){document.body.classList.remove('capturing');toast('이미지를 만들지 못했어요.');return}
  document.body.classList.remove('capturing');
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  const label={cap:(S.people.find(p=>p.id===S.cur)||{}).name,capgh:'궁합',captd:'오늘의운세'}[id]||'결과';const name=`사주_${label}_${new Date().toISOString().slice(0,10)}.png`.replace(/[\\/:*?"<>|]/g,'');
  let dl=null;try{dl=await dlP}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});toast('이미지를 저장했어요.');return}catch(e){if(e&&e.code==='declined')return}}
  const url=URL.createObjectURL(blob);
  const standalone=!window.claude;
  $('#ovl').innerHTML=`<div class="overlay" data-act="closeOvl"><img src="${url}" alt="결과 이미지"><p>${standalone?'아래 버튼으로 내려받거나, 이미지를 길게 눌러 저장하세요.':'이미지를 길게 눌러 저장하세요.'}</p><div class="row" style="justify-content:center">${standalone?`<a class="btn primary" href="${url}" download="${esc(name)}">내려받기</a>`:''}<button class="btn" data-act="closeOvl">닫기</button></div></div>`;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(S.showSettings)return viewSettings();
  if(S.view==='form')return viewForm();
  if(S.tab==='people')return S.view==='result'?viewResult():viewList();
  if(S.tab==='gh')return viewGH();
  return viewToday();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab],[data-open],[data-year],[data-a],[data-b],[data-t],[data-sw],[data-info],[data-cat],[data-nat],[data-ycat]');if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.tab){const again=t.hasAttribute('aria-current')&&!S.showSettings;S.tab=d.tab;S.showSettings=false;if(S.view==='form'){S.view=S.cur?'result':'list';S.edit=null}if(d.tab==='people'&&again)S.view='list';render();window.scrollTo(0,0);return}
  if(d.open){S.cur=d.open;S.view='result';S.yearSel=null;S.confirmDel=false;render();window.scrollTo(0,0);return}
  if(d.year){const sl=$('#seun').scrollLeft;S.yearSel=+d.year;const x=window.scrollY;render();$('#seun').scrollLeft=sl;window.scrollTo(0,x);return}
  if(d.cat){S.todayCat=d.cat;const x=window.scrollY;render();window.scrollTo(0,x);return}
  if(d.nat||d.ycat){if(d.nat)S.natCat=d.nat;else S.yearCat=d.ycat;const sl=$('#seun')?$('#seun').scrollLeft:0;const x=window.scrollY;render();if($('#seun'))$('#seun').scrollLeft=sl;window.scrollTo(0,x);return}
  if(d.a){S.ghA=d.a;render();return} if(d.b){S.ghB=d.b;render();return} if(d.t){S.todayId=d.t;render();return}
  if(d.info){S.info[d.info]=!S.info[d.info];const x=window.scrollY;render();window.scrollTo(0,x);return}
  if(d.sw){S.settings[d.sw]=!S.settings[d.sw];save();render();return}
  switch(d.act){
    case 'add':S.tab='people';S.showSettings=false;S.edit={gender:null,cal:'solar',leap:false,timeKnown:true,hh:12,mm:0,m:1,d:1,city:'서울'};S.view='form';render();window.scrollTo(0,0);break;
    case 'edit':S.edit=Object.assign({},S.people.find(p=>p.id===S.cur));S.view='form';render();window.scrollTo(0,0);break;
    case 'cancelForm':S.view=S.edit&&S.edit.id?'result':'list';S.edit=null;render();break;
    case 'toList':S.view='list';S.confirmDel=false;render();break;
    case 'del':S.confirmDel=true;render();break;
    case 'delNo':S.confirmDel=false;render();break;
    case 'delYes':S.people=S.people.filter(p=>p.id!==S.cur);save();S.confirmDel=false;S.view='list';S.cur=null;render();toast('삭제했어요.');break;
    case 'settings':S.showSettings=true;render();window.scrollTo(0,0);break;
    case 'closeSettings':S.showSettings=false;render();break;
    case 'saveImg':saveImg(d.target);break;
    case 'closeOvl':if(e.target===t){const img=$('#ovl img');if(img)URL.revokeObjectURL(img.src);$('#ovl').innerHTML=''}break;
    case 'copyBk':{const ta=$('#bk');const done=()=>toast('복사했어요.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast('선택된 코드를 복사해 주세요.')})}else{ta.select();toast('선택된 코드를 복사해 주세요.')}break}
    case 'loadBk':{try{const arr=JSON.parse($('#bk').value);if(!Array.isArray(arr)||!arr.every(p=>p&&p.id&&p.name&&p.y))throw 0;S.people=arr;save();$('#bkerr').textContent='';toast(`${arr.length}명을 불러왔어요.`)}catch(_){$('#bkerr').textContent='코드 형식이 맞지 않아요. 복사한 백업 코드 전체를 붙여넣어 주세요.'}break}
  }
});
render();
})();
</script>

</body></html>
